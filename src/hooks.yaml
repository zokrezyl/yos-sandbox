# YOS Hook Configuration - Linux Host Platform
# Functions listed here call yos_<func>() instead of native libc
# Everything NOT listed: passthrough to libc
#
# IMPORTANT: No silent stubs! Unimplemented functions must:
# 1. Log YOS_ERROR with function name and args
# 2. Return -ENOSYS (or appropriate error)

process:
  - fork
  - vfork
  - execve
  - _exit
  - exit
  - getpid
  - getppid
  - getpgrp
  - setpgid
  - setsid
  - getsid
  - wait
  - waitpid
  - wait3
  - wait4
  - kill
  - raise

