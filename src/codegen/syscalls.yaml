    returns: ptr
    handler: passthrough
    native: strerror(errnum)

  - name: stpcpy
    params: [{dest: ptr}, {src: ptr}]
    returns: ptr
    handler: wasm_impl
    body: "char*d=(char*)dest;const char*s=(const char*)src;while((*d=*s++))d++;return d;"

  - name: stpncpy
    params: [{dest: ptr}, {src: str}, {n: u32}]
    returns: ptr
